# Build a CUDA-enabled mistralrs.exe on a Windows runner.
#
# Upstream publishes CUDA binaries for Linux only and a CPU-only Windows zip, so the
# Windows GPU build does not exist as an artifact anywhere. A GitHub runner has no GPU,
# which does not matter: nvcc compiles device code without one. What we want out of this
# is a downloadable .exe and a wall-clock number to compare against building locally.
#
# PagedAttention is Unix-only upstream and compiles out on Windows.
name: windows-cuda-mistralrs

on:
  workflow_dispatch:
    inputs:
      compute_cap:
        description: "CUDA compute capability (86 = RTX 3060/3090)"
        required: false
        default: "86"

jobs:
  build:
    # windows-2022, not windows-latest. The latest image ships Visual Studio 18, whose
    # STL hard-refuses CUDA older than 13.2:
    #   yvals_core.h(911): error STL1002: Unexpected compiler version, expected CUDA 13.2
    # and nvcc 12.8 independently refuses any host compiler past VS2022. Overriding nvcc's
    # side with -allow-unsupported-compiler only moves the error into the STL headers.
    # windows-2022 carries VS2022, which is the pair CUDA 12.8 supports and the pair the
    # local build was validated with.
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Report runner size
        shell: pwsh
        run: |
          Write-Host "cores: $env:NUMBER_OF_PROCESSORS"
          Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name
          Get-PSDrive C | Select-Object Used,Free

      # Our fork, not upstream: upstream master does not compile on Windows. Its
      # marlin kernel header throws std::runtime_error built from std::to_string while
      # including only <iostream>, which libstdc++ forgives and MSVC does not. The fork
      # carries that two-line include fix and nothing else.
      - name: Checkout mistral.rs (fork with the Windows include fix)
        uses: actions/checkout@v4
        with:
          repository: He-Ach/mistral.rs
          ref: windows-cuda-fix
          fetch-depth: 1

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        id: cuda
        with:
          cuda: "12.8.0"
          method: "network"
          # Only what nvcc needs to compile the kernels; the full toolkit is a much
          # larger download for no gain on a build-only runner.
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'

      # nvcc shells out to a host compiler and finds it on PATH only. The runner has
      # Visual Studio installed but does not put cl.exe on PATH, so without this every
      # .cu file dies with "nvcc fatal : Cannot find compiler 'cl.exe' in PATH" — which
      # is exactly how the first run of this workflow failed.
      - name: Put MSVC on PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          # A cold run is the number we are measuring; the cache is what makes every
          # later run cheap.
          key: mistralrs-cuda-${{ inputs.compute_cap }}

      # pwsh, not bash. Under `shell: bash` the runner puts Git for Windows' usr/bin
      # ahead of MSVC on PATH, so rustc resolves `link.exe` to GNU coreutils `link`
      # and every build script dies with "/usr/bin/link: extra operand". That is how
      # the second run of this workflow failed.
      - name: Build
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: ${{ inputs.compute_cap }}
          # Rust links the dynamic CRT on windows-msvc while nvcc defaults to the static
          # one, and one binary cannot contain both:
          #   rust-lld: /failifmismatch: mismatch detected for 'RuntimeLibrary'
          #   mistralrsquant.lib = MD_DynamicRelease, libmoe.a = MT_StaticRelease
          #
          # The fork's build.rs already fixes mistralrs's own kernels. libmoe.a belongs to
          # candle-kernels, a git dependency whose build script has no msvc branch, so
          # CUDA_NVCC_FLAGS (a mistralrs-specific knob) cannot reach it. nvcc reads
          # NVCC_PREPEND_FLAGS on every invocation no matter which build script spawned
          # it, which is what makes it work for a dependency's kernels too.
          #
          # Dash-spelled -MD: cl accepts it identically to /MD, and it survives shells
          # that rewrite leading-slash values into paths.
          NVCC_PREPEND_FLAGS: "-Xcompiler -MD"
        run: |
          nvcc --version | Select-Object -Last 2
          rustc --version
          Write-Host "linker resolves to: $((Get-Command link.exe).Source)"
          $start = Get-Date
          cargo build --release --features cuda -p mistralrs-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $secs = [int]((Get-Date) - $start).TotalSeconds
          "BUILD_SECONDS=$secs" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Report build time
        shell: pwsh
        run: |
          Write-Host "::notice title=Windows CUDA build::$env:BUILD_SECONDS s on $env:NUMBER_OF_PROCESSORS cores"
          Get-Item target/release/mistralrs.exe | Select-Object Name,Length,LastWriteTime

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mistralrs-windows-cuda-sm${{ inputs.compute_cap }}
          path: target/release/mistralrs.exe
          if-no-files-found: error
